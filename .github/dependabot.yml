version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: staging
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: Europe/Warsaw }
    cooldown: { default-days: 7 }
    commit-message: { prefix: build, prefix-development: build, include: scope }
    ignore:
      # ADR 0007: SQLAlchemy stays on the 2.0 line until the owner revisits it.
      - dependency-name: sqlalchemy
        update-types: [version-update:semver-minor, version-update:semver-major]
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule: { interval: weekly }
    commit-message: { prefix: ci, include: scope }
    cooldown: { default-days: 7 }
  - package-ecosystem: docker
    directories: ["/deploy/docker", "/deploy/caddy", "/deploy/postgres", "/deploy/backup"]
    target-branch: staging
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
