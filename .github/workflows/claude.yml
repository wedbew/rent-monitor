name: claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]

permissions: {}

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Public repo: only trusted authors may trigger the agent (comment) or apply the `agent` label (needs triage/write).
    if: >-
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'agent') ||
      (github.event_name != 'issues' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action != 'labeled' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Machine-user token: PRs opened with the default GITHUB_TOKEN do not trigger CI, so required checks would never run.
          github_token: ${{ secrets.AGENT_BOT_TOKEN }}
          label_trigger: agent
          claude_args: |
            --max-turns 40
            --allowedTools "Bash(uv:*),Bash(make:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*),Bash(gh run:*),Edit,Write,Read,Glob,Grep"
            --append-system-prompt "Follow .agent/agents.md. Branch from staging, open PRs against staging, title type(RM-<issue>): subject."
