name: claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  workflow_dispatch:
    inputs:
      prompt:
        description: "Read-only canary prompt (job `canary`: Read tool only, no write access, no branch or PR)"
        type: string
        default: "Read README.md and reply with exactly one sentence saying what this project is. Change nothing."

permissions: {}

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    # Public repo: only trusted authors may trigger the agent (comment) or apply the `agent` label (needs triage/write).
    if: >-
      github.event_name != 'workflow_dispatch' && (
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'agent') ||
      (github.event_name != 'issues' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.action != 'labeled' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: preflight - secrets present (fail in seconds with the owner action, not after a silent 2 s error)
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BOT: ${{ secrets.AGENT_BOT_TOKEN }}
          GH_TOKEN: ${{ secrets.AGENT_BOT_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          missing=""
          [ -n "$OAUTH" ] || missing="CLAUDE_CODE_OAUTH_TOKEN"
          [ -n "$BOT" ] || missing="$missing AGENT_BOT_TOKEN"
          if [ -n "$missing" ]; then
            msg="Headless agent cannot start: empty secret(s):$missing. Owner action: run 'claude setup-token' in a terminal, then 'gh secret set CLAUDE_CODE_OAUTH_TOKEN --repo ${{ github.repository }}' and paste it (docs/AUTONOMY.md). Run: $RUN_URL"
            echo "::error::$msg"
            if [ -n "$ISSUE" ] && [ -n "$BOT" ]; then gh issue comment "$ISSUE" --repo "${{ github.repository }}" --body "$msg" || true; fi
            exit 1
          fi
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Machine-user token: PRs opened with the default GITHUB_TOKEN do not trigger CI, so required checks would never run.
          github_token: ${{ secrets.AGENT_BOT_TOKEN }}
          label_trigger: agent
          claude_args: |
            --max-turns 40
            --allowedTools "Bash(uv:*),Bash(make:*),Bash(git:*),Bash(gh pr:*),Bash(gh issue:*),Bash(gh run:*),Edit,Write,Read,Glob,Grep"
            --append-system-prompt "Follow .agent/agents.md. Branch from staging, open PRs against staging, title type(RM-<issue>): subject."
      - name: failure diagnostics (sanitised error facts from the execution file; never the transcript)
        if: ${{ failure() }}
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          {
            echo "### claude failure diagnostics"
            echo '```'
            python3 scripts/claude_failure_report.py "${EXEC:-/nonexistent}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          first="$(python3 scripts/claude_failure_report.py "${EXEC:-/nonexistent}" | grep -E '^(result.text|.*\.errors)' | head -1)"
          echo "::error title=claude failed::${first:-no error fields in the execution file}"

  canary:
    # Manual, read-only: proves the credential, model and action work end to end without touching the repository.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: preflight - secret present
        env:
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$OAUTH" ]; then echo "::error::CLAUDE_CODE_OAUTH_TOKEN is empty"; exit 1; fi
      - uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        id: claude
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ inputs.prompt }}
          claude_args: |
            --max-turns 3
            --allowedTools "Read"
      - name: answer (sanitised, bounded)
        if: ${{ success() }}
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: python3 scripts/claude_failure_report.py --show-result "${EXEC:-/nonexistent}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: failure diagnostics (sanitised error facts from the execution file; never the transcript)
        if: ${{ failure() }}
        env:
          EXEC: ${{ steps.claude.outputs.execution_file }}
        run: |
          {
            echo "### claude canary failure diagnostics"
            echo '```'
            python3 scripts/claude_failure_report.py "${EXEC:-/nonexistent}"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          first="$(python3 scripts/claude_failure_report.py "${EXEC:-/nonexistent}" | grep -E '^(result.text|.*\.errors)' | head -1)"
          echo "::error title=canary failed::${first:-no error fields in the execution file}"
