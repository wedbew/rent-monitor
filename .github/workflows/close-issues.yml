name: close-issues
# `Closes #n` only auto-closes on a merge into the default branch (main). PRs merge into staging,
# so close the linked issues here (never delete them).
on:
  pull_request:
    types: [closed]
    branches: [staging]

permissions: {}

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: close linked issues
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          printf '%s' "$BODY" \
            | grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' \
            | grep -Eo '[0-9]+' | sort -u \
            | while read -r n; do
                gh issue close "$n" --reason completed \
                  --comment "Merged in #${PR} (${SHA:0:7}) into staging." || true
              done
