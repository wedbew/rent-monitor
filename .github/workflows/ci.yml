name: ci
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_LOCKED: "1"
  APP_ENV: test

jobs:
  changes:
    # A change only runs the stages it can affect (scripts/changed_paths.py, tests/tooling/test_changed_paths.py):
    #   docs_only  nothing here runs (the title check and the secret scan in other workflows still do)
    #   python     lint, types, tests, migrations: skipped for documentation and for a frontend-only change
    #   frontend   `pnpm check`, the mocked browser lane, the visual lane: skipped unless frontend/, the OpenAPI
    #              document, the report schema or a workflow changed
    #   journey    the SPA on the real Compose stack: also runs for backend, deploy and lockfile changes
    # A skipped job shows as "skipped" and satisfies a required check. A flag that is empty (this job failed) or
    # unknown means "run": every `if` below tests `!= 'false'`, so any doubt runs the full pipeline.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      docs_only: ${{ steps.diff.outputs.docs_only }}
      python: ${{ steps.diff.outputs.python }}
      frontend: ${{ steps.diff.outputs.frontend }}
      journey: ${{ steps.diff.outputs.journey }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/changed_paths.py "$BASE" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  lint:
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --all-packages --group dev
      - run: uv run ruff check --output-format=github .
      - run: uv run ruff format --check .

  types:
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --all-packages --group dev
      - run: uv run pyright

  types-ty-trial:
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --all-packages --group dev
      - run: uvx ty check packages services

  test:
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --all-packages --group dev
      # One Postgres container per worker and one database per test module (tests/db_fixtures.py); `loadfile` keeps a
      # file's tests in one worker, in order, because some files share module state.
      - run: uv run pytest -m "not e2e" --cov --cov-report=term-missing -q -n auto --dist loadfile

  invariants:
    # Off until the engine and its four invariant tests exist: set repo variable ENABLE_INVARIANTS_JOB=true
    # (and re-add `invariants` to the staging required checks) in the PR that lands them. See docs/PRE-DEPLOYMENT.md §1.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' && vars.ENABLE_INVARIANTS_JOB == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --all-packages --group dev
      - name: invariant tests (must exist, must not be skipped)
        run: |
          uv run pytest -m invariant -q -rs --junitxml=invariants.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          required = {"test_invariant_rent_is_not_a_deal", "test_invariant_asking_is_not_deed",
                      "test_invariant_admin_fee_is_opex", "test_invariant_deterministic_math",
                      "test_invariant_fractional_ownership_rejected",
                      "test_invariant_json_is_canonical_markdown_is_a_view",
                      "test_invariant_llm_adjustment_is_clamped"}
          cases = ET.parse("invariants.xml").getroot().iter("testcase")
          passed = {c.get("name").split("[")[0] for c in cases if not list(c)}
          missing = required - passed
          if missing:
              raise SystemExit(f"invariant tests missing or not passing: {sorted(missing)}")
          PY

  migrations:
    # Off until Alembic and tests/migrations exist: set repo variable ENABLE_MIGRATIONS_JOB=true
    # (and re-add `migrations` to the staging required checks) in the data-plane PR.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' && vars.ENABLE_MIGRATIONS_JOB == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --all-packages --group dev
      - run: uv run pytest tests/migrations -q
      - name: squawk on migration SQL
        run: |
          uv run alembic upgrade head --sql > /tmp/migrations.sql
          npx --yes squawk-cli@2.68.0 /tmp/migrations.sql

  # ---------------------------------------------------------------- the SPA (frontend/, audit F01, #296)
  # Gated by the `frontend` and `journey` flags of the `changes` job (a skipped job satisfies a required check, so
  # nothing is left pending). Invariant 4 in the browser (no finance in TypeScript) is enforced by the tested
  # ESLint money guard in `pnpm check` (frontend/eslint.money.mjs), which replaces the old check for two obsolete
  # file paths.
  frontend:
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: check (generated API drift, types, ESLint, Stylelint, Prettier, Vitest, build, dist scan)
        run: pnpm check
      - name: bundle size
        run: |
          {
            echo "### SPA bundle (gzip)"
            echo '```'
            for f in dist/assets/*.js dist/assets/*.css; do printf '%8d B  %s\n' "$(gzip -9c "$f" | wc -c)" "${f#dist/}"; done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  frontend-e2e:
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Chromium (the version pinned by the Playwright lockfile entry)
        run: pnpm exec playwright install --with-deps chromium
      - name: mocked lane (axe, popups, interaction-coverage gate)
        run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-e2e-traces
          path: |
            frontend/test-results
            frontend/playwright-report
          retention-days: 7

  frontend-visual:
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    needs: changes
    # Visual baselines (#334): compared inside the same pinned Playwright image `pnpm visual` uses locally (fonts and
    # rendering are what make a picture comparable). Bump the digest together with @playwright/test and the baselines
    # (`pnpm visual:update`, then look at every changed picture). No secrets are used.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f
      options: --ipc=host
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    env:
      CI: "1"
      E2E_LANE: visual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The same script `pnpm visual` runs: Node from frontend/.node-version (the image's own is older), then the install.
      # Everything else about the stack (image digest, Playwright, Node) is checked against BASELINE.json by `pnpm test`.
      - name: visual lane against the committed baselines
        shell: bash
        run: . e2e/visual-prepare.sh && pnpm exec playwright test --reporter=list
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-visual-diffs
          path: frontend/test-results
          retention-days: 7

  frontend-journey:
    if: ${{ !cancelled() && needs.changes.outputs.journey != 'false' }}
    needs: changes
    # The SPA against the real Compose stack (API, Postgres, workers, fake providers). The session is seeded
    # inside the api container by scripts/e2e_session.py; no secrets are used.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version
      - run: corepack enable
      - name: stack
        run: docker compose -f deploy/compose.yml -f deploy/compose.e2e.yml up -d --build --wait api worker-audit worker-ops
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - name: journey lane
        run: pnpm test:e2e:journey
        working-directory: frontend
      - if: failure()
        name: stack logs
        run: docker compose -f deploy/compose.yml -f deploy/compose.e2e.yml logs --no-color --tail=300 api worker-audit
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-journey-traces
          path: frontend/test-results
          retention-days: 7
