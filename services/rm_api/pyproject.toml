[project]
name = "rm-api"
version = "0.0.0"
description = "FastAPI service (stateless; all state in Postgres)"
requires-python = ">=3.12"
dependencies = [
  "rm-core",
  "rm-contracts",
  "fastapi>=0.120",
  "uvicorn[standard]>=0.38",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The folder IS the package: wheel files are prefixed with the module name, and the editable
# install puts the parent folder on sys.path so `import rm_api` resolves to this folder.
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
include = ["**/*.py"]

[tool.hatch.build.targets.wheel.sources]
"" = "rm_api"
