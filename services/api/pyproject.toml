[project]
name = "rm-api"
version = "0.0.0"
description = "FastAPI service (stateless; all state in Postgres)"
requires-python = ">=3.12"
dependencies = [
  "rm-core",
  "rm-contracts",
  "fastapi>=0.120",
  "uvicorn[standard]>=0.38",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rm_api"]
