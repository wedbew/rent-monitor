[project]
name = "rm-worker"
version = "0.0.0"
description = "Procrastinate workers: audit, batch, ops queues"
requires-python = ">=3.12"
dependencies = [
    "rm-core",
    "rm-contracts",
    "procrastinate>=3.10,<4",
    "curl-cffi>=0.16,<0.17",
    "pillow>=11,<13",
    "httpx>=0.28",
]
# procrastinate, sqlalchemy, psycopg join in the data-plane step (blueprint 4.8 step 2); check context7 first.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The folder IS the package: wheel files are prefixed with the module name, and the editable
# install puts the parent folder on sys.path so `import rm_worker` resolves to this folder.
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel]
include = ["**/*.py"]

[tool.hatch.build.targets.wheel.sources]
"" = "rm_worker"
