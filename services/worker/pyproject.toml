[project]
name = "rm-worker"
version = "0.0.0"
description = "Procrastinate workers: audit, batch, ops queues"
requires-python = ">=3.12"
dependencies = ["rm-core", "rm-contracts"]
# procrastinate, sqlalchemy, psycopg join in the data-plane step (blueprint 4.8 step 2); check context7 first.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rm_worker"]
