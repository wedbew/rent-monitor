# VPS-1 (4 GB, 4 vCore) overlay: resource limits and container hardening. Use on top of the base file:
#   docker compose -f deploy/compose.yml -f deploy/compose.vps1.yml up -d --build --wait
# Offline slice (RM-224): nothing here exposes a public port; Caddy/TLS, WAL-G and offsite backups stay in RM-15.
# Memory limits sum to 3.2 GB, leaving headroom on a 4 GB host (the blueprint resource matrix is written for VPS-3; L-020).
# Connection budget: API pool plus worker pools stay far under 70 of max_connections=100 (blueprint §6). Postgres is
# not published on the host, so only containers on the compose network can reach it.
x-hardened: &hardened
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp:size=64m,noexec,nosuid"]
  pids_limit: 256

services:
  postgres:
    ports: !reset []
    mem_limit: 1g
    cpus: 1.5
    shm_size: 256m
    security_opt: ["no-new-privileges:true"]
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=192MB
      - -c
      - effective_cache_size=512MB
      - -c
      - log_min_duration_statement=500
      - -c
      - log_lock_waits=on

  bootstrap:
    <<: *hardened
    mem_limit: 384m

  api:
    <<: *hardened
    mem_limit: 512m
    cpus: 1.0

  worker-audit:
    <<: *hardened
    # The engine child is capped at AUDIT_CHILD_MEMORY_MB (address space); the parent needs room on top of it.
    mem_limit: 1280m
    cpus: 1.5

  worker-ops:
    <<: *hardened
    mem_limit: 384m
    cpus: 0.5
