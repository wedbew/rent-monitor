# Local development stack: Postgres 17 only (the API and worker run with `uv run` on the host).
# The full production-shaped stack lives in deploy/compose.yml (RM-15); this file layers on top of it later.
# Credentials below are for a throwaway local database bound to loopback; never reuse them anywhere else.
name: rentmonitor-dev

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rentmonitor}
      POSTGRES_USER: ${POSTGRES_USER:-rentmonitor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=256MB", "-c", "log_min_duration_statement=500"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
