rules:
  - id: no-float-money
    message: Money must be Decimal (agents.md §3). Do not convert money fields with float().
    severity: ERROR
    languages: [python]
    paths:
      include: ["packages/", "services/"]
    pattern-either:
      - pattern: float($X.$F)
      - pattern: "$NAME: float = ..."
    metavariable-regex:
      metavariable: $F
      regex: (?i).*(pln|price|amount|bid|capex|balance|cost|rent|fee).*

  - id: stripe-body-parsed-before-signature
    message: Verify the Stripe signature on the raw body before parsing it (blueprint 4.5 c).
    severity: ERROR
    languages: [python]
    paths:
      include: ["services/api/"]
    patterns:
      - pattern-inside: |
          async def stripe_webhook(...):
              ...
      - pattern: await $REQ.json()

  - id: no-pull-request-target
    message: pull_request_target with secrets is banned (Trivy compromise, Feb–Mar 2026).
    severity: ERROR
    languages: [yaml]
    paths:
      include: [".github/workflows/"]
    pattern: |
      on:
        ...
        pull_request_target: ...
