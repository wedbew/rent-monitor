rules:
  - id: no-float-money
    message: Money must be Decimal (agents.md §3). Do not annotate or convert money with float.
    severity: ERROR
    languages: [python]
    paths:
      include: ["packages/", "services/", "apps/"]
    # Every pattern binds $F, so the name regex applies to all of them (RM-55). Tests: .semgrep/rentmonitor.py
    patterns:
      - pattern-either:
          - pattern: float($X.$F)
          - pattern: float($F)
          - pattern: "$F: float"
          - pattern: "$F: float = $V"
          - pattern: "$F: float | None = $V"
          - pattern: "$F: Mapped[float] = $V"
          - pattern: "def $FN(..., $F: float, ...): ..."
          - pattern: "def $FN(..., $F: float = $D, ...): ..."
      - metavariable-regex:
          metavariable: $F
          regex: (?i).*(pln|zl|price|amount|bid|capex|opex|balance|cost|rent|fee|czynsz|tax|vat|income|revenue|payment|invoice).*

  - id: stripe-body-parsed-before-signature
    message: Verify the Stripe signature on the raw body before parsing it (blueprint 4.5 c).
    severity: ERROR
    languages: [python]
    paths:
      include: ["services/api/"]
    patterns:
      - pattern-inside: |
          async def stripe_webhook(...):
              ...
      - pattern: await $REQ.json()

  - id: no-pull-request-target
    message: pull_request_target with secrets is banned (Trivy compromise, Feb–Mar 2026).
    severity: ERROR
    languages: [yaml]
    paths:
      include: [".github/workflows/"]
    pattern: |
      on:
        ...
        pull_request_target: ...
