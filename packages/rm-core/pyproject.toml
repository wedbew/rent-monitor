[project]
name = "rm-core"
version = "0.0.0"
description = "Settings, legal tags, (later) models, repositories, ledger, entitlements, flags"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.20,<2",
  "psycopg[binary,pool]>=3.3,<4",
  "pydantic>=2.12",
  "pydantic-settings>=2.11",
  "sentry-sdk>=2.40,<3",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "structlog>=25.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rm_core"]
