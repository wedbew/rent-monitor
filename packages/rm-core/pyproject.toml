[project]
name = "rm-core"
version = "0.0.0"
description = "Settings, legal tags, (later) models, repositories, ledger, entitlements, flags"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.12",
  "pydantic-settings>=2.11",
  "structlog>=25.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rm_core"]
