[project]
name = "rm-contracts"
version = "0.0.0"
description = "Pydantic API schemas and stable problem codes shared by api and worker"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rm_contracts"]
